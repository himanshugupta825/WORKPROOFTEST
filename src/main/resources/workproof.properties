# ============================================================================
#  WorkProof - application configuration (safe defaults, NO secrets here)
#
#  Resolution order (first match wins):
#    1. environment variables   e.g. WORKPROOF_DB_PASSWORD
#    2. JVM system properties   e.g. -Dworkproof.db.password=...
#    3. this file               (defaults, shared by everybody)
#    4. workproof-local.properties (your own machine, ignored by Git)
#
#  NEVER put a real production password in this file - it is committed to Git.
#  For your local password, either export an environment variable or copy
#  workproof-local.properties.example (same folder) to workproof-local.properties
#  and fill it in - that file is ignored by Git.
# ============================================================================

# ---- database ----
workproof.db.url=jdbc:mysql://localhost:3306/workproof?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8&useUnicode=true
workproof.db.user=workproof_app
workproof.db.password=

# Connection pool size (2-50). 10 is plenty for a college demo.
workproof.db.poolSize=10

# ---- file uploads ----
# Evidence files are stored OUTSIDE the web application root on purpose.
# Default when empty: <your home directory>/workproof-uploads
workproof.upload.dir=
# Maximum size of a single evidence file, in megabytes (1-50).
workproof.upload.maxFileSizeMb=10

# ---- session ----
workproof.session.timeoutMinutes=30

# ---- application ----
workproof.app.name=WorkProof

# ---- documented project rule ----
# false = a user may never review their own submission (recommended).
# Set to true only if your institution explicitly allows self-review.
workproof.review.allowSelfReview=false
