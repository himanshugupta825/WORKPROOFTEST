<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/main :: head('Create Account')}"></head>
<body class="bg-light">

<div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
    <div class="text-center mb-3">
        <a th:href="@{/login}" class="text-decoration-none">
            <h2 class="fw-bold text-dark mb-0"><i class="bi bi-shield-check text-primary me-1"></i> WorkProof</h2>
        </a>
        <p class="text-muted small">Register a new account</p>
    </div>

    <div class="card shadow-sm border-0 rounded-4" style="max-width: 520px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <h4 class="fw-bold text-dark mb-3">Account Registration</h4>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small shadow-sm" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error</span>
            </div>

            <form th:action="@{/register}" th:object="${registerDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="fullName" class="form-label small fw-semibold text-secondary">Full Name / Organization</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="Jane Doe / Acme Corp" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="jane@example.com" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="At least 6 chars" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label small fw-semibold text-secondary">Confirm Password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter password" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label small fw-semibold text-secondary">Account Role</label>
                    <select id="role" th:field="*{role}" class="form-select">
                        <option value="TECHNICIAN">Technician (Field service worker)</option>
                        <option value="CUSTOMER">Customer (Client requesting proof of work)</option>
                        <option value="MANAGER">Manager (Team leader / supervisor)</option>
                    </select>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-md-6">
                        <label for="phone" class="form-label small fw-semibold text-secondary">Phone (Optional)</label>
                        <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="+1-555-0100">
                    </div>
                    <div class="col-md-6">
                        <label for="department" class="form-label small fw-semibold text-secondary">Department / Note</label>
                        <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="Field Services">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                    Create Account
                </button>
            </form>

            <div class="text-center text-muted small">
                Already registered? <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">Sign In</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
