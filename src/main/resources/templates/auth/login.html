<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/main :: head('Sign In')}"></head>
<body class="bg-light">

<div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle p-3 mb-2 shadow">
            <i class="bi bi-shield-check fs-1"></i>
        </div>
        <h2 class="fw-bold text-dark mb-1">WorkProof</h2>
        <p class="text-muted">Digital Proof-of-Work & Evidence Platform</p>
    </div>

    <div class="card shadow-sm border-0 rounded-4" style="max-width: 440px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <h4 class="fw-bold text-dark mb-3 text-center">Sign In</h4>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small shadow-sm" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error message</span>
            </div>
            <div th:if="${successMessage}" class="alert alert-success py-2 small shadow-sm" role="alert">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${successMessage}">Success message</span>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" placeholder="name@company.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                    Sign In <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="card bg-light border-0 p-3 mb-3 rounded-3 small">
                <div class="fw-bold text-secondary mb-1">Quick Demo Accounts:</div>
                <div class="d-flex justify-content-between text-muted"><span>Admin:</span> <code>admin@workproof.com / admin123</code></div>
                <div class="d-flex justify-content-between text-muted"><span>Technician:</span> <code>tech@workproof.com / tech123</code></div>
                <div class="d-flex justify-content-between text-muted"><span>Customer:</span> <code>customer@workproof.com / customer123</code></div>
            </div>

            <div class="text-center text-muted small">
                Don't have an account? <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Create Account</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
