<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{layout/main :: head('Locations')}"></head>
<body>

<nav th:replace="~{layout/main :: navbar}"></nav>
<div th:replace="~{layout/main :: alerts}"></div>

<main class="main-container container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-0">Service Locations</h3>
            <p class="text-muted small mb-0">Manage customer facilities, job sites and points of service</p>
        </div>
        <a th:href="@{/locations/create}" class="btn btn-primary btn-sm" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
            <i class="bi bi-plus-lg me-1"></i> Add Location
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light small text-secondary">
                    <tr>
                        <th class="ps-3">Location Name</th>
                        <th>Address</th>
                        <th>City / Zip</th>
                        <th>Site Contact</th>
                        <th>Contact Phone</th>
                        <th class="text-end pe-3" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(locations)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-geo fs-1 d-block mb-2 text-secondary opacity-50"></i>
                            No locations registered yet.
                        </td>
                    </tr>
                    <tr th:each="loc : ${locations}">
                        <td class="ps-3">
                            <span class="fw-bold text-dark" th:text="${loc.name}">Location Name</span>
                        </td>
                        <td class="small" th:text="${loc.address}">123 Main St</td>
                        <td class="small">
                            <span th:text="${loc.city}">City</span>
                            <span th:if="${loc.postalCode}" th:text="' ' + ${loc.postalCode}">94105</span>
                        </td>
                        <td class="small" th:text="${loc.contactName != null ? loc.contactName : '--'}">Contact</td>
                        <td class="small" th:text="${loc.contactPhone != null ? loc.contactPhone : '--'}">Phone</td>
                        <td class="text-end pe-3" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
                            <a th:href="@{'/locations/' + ${loc.id} + '/edit'}" class="btn btn-outline-secondary btn-sm py-1 px-2">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
