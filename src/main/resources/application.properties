# ============================================================================
# WorkProof Application Properties
# ============================================================================
spring.application.name=WorkProof
server.port=8080

# ----------------------------------------------------------------------------
# Database Connection (PostgreSQL with Environment Variable Overrides)
# Never hard-code production credentials here.
# ----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workproof}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ----------------------------------------------------------------------------
# File Upload Configuration (Stored outside web root)
# ----------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
workproof.upload.dir=${WORKPROOF_UPLOAD_DIR:uploads}
workproof.upload.max-file-size-mb=10

# ----------------------------------------------------------------------------
# Thymeleaf Configuration
# ----------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
logging.level.com.workproof=INFO
logging.level.org.springframework.security=WARN
