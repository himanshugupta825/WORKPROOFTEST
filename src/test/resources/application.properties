# Test database configuration (In-Memory H2 in PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:workproof_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# File upload test settings
workproof.upload.dir=target/test-uploads
workproof.upload.max-file-size-mb=10

